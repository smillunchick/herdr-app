[package]
name = "herdr-android"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "herdr_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
herdr-app = { path = ".." }
android-activity = { version = "0.6", features = ["native-activity"] }
gpui-mobile = { git = "https://github.com/smillunchick/gpui-mobile", rev = "85d9bd2", default-features = false }
jni = "0.22"
ndk = { version = "0.9", features = ["nativewindow"] }
